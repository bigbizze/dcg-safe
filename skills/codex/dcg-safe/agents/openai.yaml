interface:
  display_name: "dcg-safe"
  short_description: "Capture allowed command evidence under trusted roots"
  default_prompt: "Use $dcg-safe to capture a DCG-allowed child command's stdout, stderr, and outcome without shell redirection; dcg-safe requires DCG 0.9.2+ as dcg beside the binary."

policy:
  allow_implicit_invocation: true
