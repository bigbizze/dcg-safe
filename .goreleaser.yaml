version: 2

project_name: dcg-safe

builds:
  - id: dcg-safe
    main: ./cmd/dcg-safe
    binary: dcg-safe
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/bigbizze/dcg-safe/internal/version.value={{ .Version }}

archives:
  - id: default
    ids:
      - dcg-safe
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - install-skill.sh
      - config.example.toml
      - skills/codex/dcg-safe/SKILL.md
      - skills/codex/dcg-safe/agents/openai.yaml
      - skills/claude/dcg-safe/SKILL.md
      - skills/claude/rules/dcg-safe.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  prerelease: auto
